<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minecraft Server Checker</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-dark text-light">

<nav class="navbar navbar-dark bg-success">
  <div class="container">
    <span class="navbar-brand">🟩 Minecraft Server Checker</span>
  </div>
</nav>

<div class="container mt-5 text-center">
  <div class="text-center mb-4">
    
    <!-- Creeper image -->
     <img src="creeper.png" alt="Creeper" style="max-width:120px;" class="mb-2">
  
  <h2>Check a Minecraft Server</h2>
  </div>
<!-- Input field and button to check the server status -->

  <div class="input-group mt-4">
    <input id="serverInput" class="form-control" placeholder="Enter server IP (ex: play.hypixel.net)">
    <button class="btn btn-light" onclick="checkServer()">Search</button>
  </div>
<!-- Div to display the results -->

  <div id="result" class="mt-4"></div>
</div>

<script src="script.js"></script>
</body>
</html>
